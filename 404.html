, 0) 0px, transparent 50%);\n    background-position: top;\n\n    opacity: var(--active, 0);\n    border-radius: var(--border_radius);\n    transition: opacity var(--transtion);\n    z-index: 2;\n  }\n\n  a.button:is(:hover, :focus-visible) {\n    --active: 1;\n  }\n  a.button:active {\n    transform: scale(1);\n  }\n\n  a.button .dots_border {\n    --size_border: calc(100% + 2px);\n\n    overflow: hidden;\n\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: var(--size_border);\n    height: var(--size_border);\n    background-color: transparent;\n\n    border-radius: var(--border_radius);\n    z-index: -10;\n  }\n\n  a.button .dots_border::before {\n    content: \"\";\n    position: absolute;\n    top: 30%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n    transform-origin: left;\n    transform: rotate(0deg);\n\n    width: 100%;\n    height: 2rem;\n    background-color: rgb(255, 255, 255);\n\n    mask: linear-gradient(transparent 0%, rgb(255, 255, 255) 120%);\n    animation: rotate 3s linear infinite;\n  }\n\n  @keyframes rotate {\n    to {\n      transform: rotate(360deg);\n    }\n  }\n\n  a.button .sparkle {\n    position: relative;\n    z-index: 10;\n\n    width: 1.75rem;\n  }\n\n  a.button .sparkle .path {\n    fill: currentColor;\n    stroke: currentColor;\n\n    transform-origin: center;\n\n    color: hsl(80, 100%, 99%);\n  }\n\n  a.button:is(:hover, :focus) .sparkle .path {\n    animation: path 1.5s linear 0.5s infinite;\n  }\n\n  a.button .sparkle .path:nth-child(1) {\n    --scale_path_1: 1.2;\n  }\n  a.button .sparkle .path:nth-child(2) {\n    --scale_path_2: 1.2;\n  }\n  a.button .sparkle .path:nth-child(3) {\n    --scale_path_3: 1.2;\n  }\n\n  @keyframes path {\n    0%,\n    34%,\n    71%,\n    100% {\n      transform: scale(1);\n    }\n    17% {\n      transform: scale(var(--scale_path_1, 1));\n    }\n    49% {\n      transform: scale(var(--scale_path_2, 1));\n    }\n    83% {\n      transform: scale(var(--scale_path_3, 1));\n    }\n  }\n\n  /* ТЕКСТ: Montserrat Bold, без затухания */\n  a.button .text_button {\n    position: relative;\n    z-index: 10;\n\n    background-image: none;\n    background-clip: border-box;\n\n    font-family: 'Montserrat', sans-serif;\n    font-weight: 700;   /* BOLD */\n    font-size: 1.13rem; /* РАЗМЕР ШРИФТА — меняй тут */\n\n    color: #ffffff;     /* ровный белый текст */\n  }\n  \u003c/style\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\n  \u003ca\n    class=\"button\"\n    href=\"https://bidask.finance/ru/app/pools/0:6e391c843f97d64e544062d983c2324d44103f0901d8a7b4538cee008e83b286\"\n    target=\"_blank\"\n    rel=\"noopener noreferrer\"\n  \u003e\n    \u003cdiv class=\"dots_border\"\u003e\u003c/div\u003e\n    \u003csvg\n      xmlns=\"http://www.w3.org/2000/svg\"\n      fill=\"none\"\n      viewBox=\"0 0 24 24\"\n      class=\"sparkle\"\n    \u003e\n      \u003cpath\n        class=\"path\"\n        stroke-linejoin=\"round\"\n        stroke-linecap=\"round\"\n        stroke=\"black\"\n        fill=\"black\"\n        d=\"M14.187 8.096L15 5.25L15.813 8.096C16.0231 8.83114 16.4171 9.50062 16.9577 10.0413C17.4984 10.5819 18.1679 10.9759 18.903 11.186L21.75 12L18.904 12.813C18.1689 13.0231 17.4994 13.4171 16.9587 13.9577C16.4181 14.4984 16.0241 15.1679 15.814 15.903L15 18.75L14.187 15.904C13.9769 15.1689 13.5829 14.4994 13.0423 13.9587C12.5016 13.4181 11.8321 13.0241 11.097 12.814L8.25 12L11.096 11.187C11.8311 10.9769 12.5006 10.5829 13.0413 10.0423C13.5819 9.50162 13.9759 8.83214 14.186 8.097L14.187 8.096Z\"\n      \u003e\u003c/path\u003e\n      \u003cpath\n        class=\"path\"\n        stroke-linejoin=\"round\"\n        stroke-linecap=\"round\"\n        stroke=\"black\"\n        fill=\"black\"\n        d=\"M6 14.25L5.741 15.285C5.59267 15.8785 5.28579 16.4206 4.85319 16.8532C4.42059 17.2858 3.87853 17.5927 3.285 17.741L2.25 18L3.285 18.259C3.87853 18.4073 4.42059 18.7142 4.85319 19.1468C5.28579 19.5794 5.59267 20.121 ound-color: hsla(107, 89%, 42%, 0.747);\n    background-image: radial-gradient(\n        at 51% 89%,\n        rgba(30, 34, 27, 0) 0px,\n        transparent 50%\n      ),\n      radial-gradient(at 100% 100%, rgba(148, 116, 190, 0) 0px, transparent 50%),\n      radial-gradient(at 22% 91%, rgba(148, 116, 190, 0) 0px, transparent 50%);\n    background-position: top;\n\n    opacity: var(--active, 0);\n    border-radius: var(--border_radius);\n    transition: opacity var(--transtion);\n    z-index: 2;\n  }\n\n  a.button:is(:hover, :focus-visible) {\n    --active: 1;\n  }\n  a.button:active {\n    transform: scale(1);\n  }\n\n  a.button .dots_border {\n    --size_border: calc(100% + 2px);\n\n    overflow: hidden;\n\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: var(--size_border);\n    height: var(--size_border);\n    background-color: transparent;\n\n    border-radius: var(--border_radius);\n    z-index: -10;\n  }\n\n  a.button .dots_border::before {\n    content: \"\";\n    position: absolute;\n    top: 30%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n    transform-origin: left;\n    transform: rotate(0deg);\n\n    width: 100%;\n    height: 2rem;\n    background-color: rgb(255, 255, 255);\n\n    mask: linear-gradient(transparent 0%, rgb(255, 255, 255) 120%);\n    animation: rotate 3s linear infinite;\n  }\n\n  @keyframes rotate {\n    to {\n      transform: rotate(360deg);\n    }\n  }\n\n  a.button .sparkle {\n    position: relative;\n    z-index: 10;\n\n    width: 1.75rem;\n  }\n\n  a.button .sparkle .path {\n    fill: currentColor;\n    stroke: currentColor;\n\n    transform-origin: center;\n\n    color: hsl(80, 100%, 99%);\n  }\n\n  a.button:is(:hover, :focus) .sparkle .path {\n    animation: path 1.5s linear 0.5s infinite;\n  }\n\n  a.button .sparkle .path:nth-child(1) {\n    --scale_path_1: 1.2;\n  }\n  a.button .sparkle .path:nth-child(2) {\n    --scale_path_2: 1.2;\n  }\n  a.button .sparkle ar(--border_radius);\n    transform: scale(calc(1 + (var(--active, 0) * 0.1)));\n\n    transition: transform var(--transtion);\n\n    /* ОТЛИПИТЬ ОТ ВЕРХА */\n    margin-top: 1px; /* меняй это значение под себя */\n\n    text-decoration: none; /* убираем подчёркивание у ссылки */\n  }\n\n  a.button::before {\n    content: \"\";\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: 100%;\n    height: 100%;\n    background-color: var(--black-700);\n\n    border-radius: var(--border_radius);\n    box-shadow: inset 0 0.5px hsl(0, 0%, 0%), inset 0 -1px 2px 0 hsl(0, 0%, 0%),\n      0px 4px 10px -4px hsla(0 0% 0% / calc(1 - var(--active, 0))),\n      0 0 0 calc(var(--active, 0) * 0.375rem) hsla(115, 85%, 38%, 0);\n\n    transition: all var(--transtion);\n    z-index: 0;\n  }\n\n  a.button::after {\n    content: \"\";\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: 100%;\n    height: 100%;\n    background-color: hsla(107, 89%, 42%, 0.747);\n    background-image: radial-gradient(\n        at 51% 89%,\n        rgba(30, 34, 27, 0) 0px,\n        transparent 50%\n      ),\n      radial-gradient(at 100% 100%, rgba(148, 116, 190, 0) 0px, transparent 50%),\n      radial-gradient(at 22% 91%, rgba(148, 116, 190, 0) 0px, transparent 50%);\n    background-position: top;\n\n    opacity: var(--active, 0);\n    border-radius: var(--border_radius);\n    transition: opacity var(--transtion);\n    z-index: 2;\n  }\n\n  a.button:is(:hover, :focus-visible) {\n    --active: 1;\n  }\n  a.button:active {\n    transform: scale(1);\n  }\n\n  a.button .dots_border {\n    --size_border: calc(100% + 2px);\n\n    overflow: hidden;\n\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: var(--size_border);\n    height: var(--size_border);\n    background-color: transparent;\n\n    border-radius: var(--border_radius);\n    z-index: -10; inset 0 -1px 2px 0 hsl(0, 0%, 0%),\n      0px 4px 10px -4px hsla(0 0% 0% / calc(1 - var(--active, 0))),\n      0 0 0 calc(var(--active, 0) * 0.375rem) hsla(115, 85%, 38%, 0);\n\n    transition: all var(--transtion);\n    z-index: 0;\n  }\n\n  a.button::after {\n    content: \"\";\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: 100%;\n    height: 100%;\n    background-color: hsla(107, 89%, 42%, 0.747);\n    background-image: radial-gradient(\n        at 51% 89%,\n        rgba(30, 34, 27, 0) 0px,\n        transparent 50%\n      ),\n      radial-gradient(at 100% 100%, rgba(148, 116, 190, 0) 0px, transparent 50%),\n      radial-gradient(at 22% 91%, rgba(148, 116, 190, 0) 0px, transparent 50%);\n    background-position: top;\n\n    opacity: var(--active, 0);\n    border-radius: var(--border_radius);\n    transition: opacity var(--transtion);\n    z-index: 2;\n  }\n\n  a.button:is(:hover, :focus-visible) {\n    --active: 1;\n  }\n  a.button:active {\n    transform: scale(1);\n  }\n\n  a.button .dots_border {\n    --size_border: calc(100% + 2px);\n\n    overflow: hidden;\n\n    position: absolute;\n    top: 50%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n\n    width: var(--size_border);\n    height: var(--size_border);\n    background-color: transparent;\n\n    border-radius: var(--border_radius);\n    z-index: -10;\n  }\n\n  a.button .dots_border::before {\n    content: \"\";\n    position: absolute;\n    top: 30%;\n    left: 50%;\n    transform: translate(-50%, -50%);\n    transform-origin: left;\n    transform: rotate(0deg);\n\n    width: 100%;\n    height: 2rem;\n    background-color: rgb(255, 255, 255);\n\n    mask: linear-gradient(transparent 0%, rgb(255, 255, 255) 120%);\n    animation: rotate 3s linear infinite;\n  }\n\n  @keyframes rotate {\n    to {\n      transform: rotate(360deg);\n    }\n  }\n\n  a.button .sparkle {\n    position: relative;\n    z-index: 10;\n\n    width: 1.75rem;\n  }\n
