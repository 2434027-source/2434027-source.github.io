
server {
  listen 80;
  server_name readymag.website;

  root "/path/to/project_folder"; # Change path to folder with downloaded source
  index index.html;

  access_log off;
  autoindex off;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

  # Long-lived cache for fingerprinted/static assets.
  location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable";
    try_files $uri =404;
  }

  # HTML should revalidate often to avoid stale releases.
  location ~* \.html$ {
    expires 5m;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri =404;
  }

  location /u1179532223/5339356 {
    if (-f $request_filename ) {
      break;
    }

    if ($args ~ "_escaped_fragment_") {
      rewrite ^/u1179532223/5339356/(.+)/$ /snippets/$1.html last;
      rewrite ^/u1179532223/5339356/([.a-zA-Z0-9-_/]+)$ /snippets/$1.html last;
      rewrite ^/u1179532223/5339356/ /snippets/1.html last;
    }

    location = /u1179532223/5339356 {
      if ($args ~ "_escaped_fragment_") {
        rewrite ^/u1179532223/5339356 /u1179532223/5339356/snippets/1.html last;
      }

      
      return 301 /u1179532223/5339356/;
      
    }

    rewrite ^/u1179532223/5339356/?$ /u1179532223/5339356/index.html last;
    rewrite ^/u1179532223/5339356/[.a-zA-Z0-9-_]+(/(.*))? /u1179532223/5339356/$2 last;

    try_files $uri $uri/;
  }
}
